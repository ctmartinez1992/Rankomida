{% extends "base.html" %}

{% block content %}
<div style="max-width:520px;margin:3rem auto;text-align:center;">
    <h1 style="margin-bottom:0.75rem;">Thanks for the suggestion!</h1>
    <p style="color:var(--color-muted);margin-bottom:2rem;">
        We'll review your submission and add it to the catalog if it checks out.
    </p>
    {% if user.is_authenticated %}
        <p style="color:var(--color-muted);margin-bottom:1.5rem;">
            You can track the status of your suggestion on
            <a href="{% url 'profile' user.username %}">your profile</a>.
        </p>
    {% endif %}
    <a href="{% url 'catalog:venue_list' %}" class="btn btn-primary">Back to venues</a>
</div>
{% endblock %}
