{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h1>Rate {{ dish.name }}</h1>
    <p class="dish-subtitle">{{ dish.venue.name }} &mdash; {{ dish.dish_type.name }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Submit rating</button>
    </form>
</div>
{% endblock %}
