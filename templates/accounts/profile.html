{% extends "base.html" %}
{% load ratings_tags %}

{% block content %}
<div class="breadcrumb">
    <a href="{% url 'catalog:list' %}">&larr; Dishes</a>
</div>

<div class="detail-card">
    <h1>{{ profile_user.username }}</h1>
    <p class="card-meta">{{ rating_count }} rating{{ rating_count|pluralize }}</p>

    {% if request.user == profile_user %}
        <a href="{% url 'profile_settings' %}" class="btn" style="margin-top:1rem;display:inline-block;">Profile settings</a>
    {% endif %}
</div>

<section class="community-notes" style="margin-top:2rem;">
    <h2>Ratings</h2>
    <div
        id="profile-ratings"
        hx-get="{% url 'profile_ratings_fragment' profile_user.username %}?sort=newest&page=1"
        hx-trigger="load"
        hx-swap="innerHTML"
    ></div>
</section>
{% endblock %}
