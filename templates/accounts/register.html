{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h1>Create account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.media }}
        {% for field in form %}
            <div class="form-group">
                {% if field.label %}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {% endif %}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>
{% endblock %}
