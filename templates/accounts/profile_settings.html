{% extends "base.html" %}

{% block content %}
<div class="form-card">
    <h1>Profile settings</h1>
    <form method="post" style="margin-top:1.5rem;">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group" style="flex-direction:row;align-items:center;gap:0.75rem;">
                {{ field }}
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {% if field.errors %}
                    <ul class="errorlist">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'profile' request.user.username %}" class="btn" style="margin-left:0.5rem;">Cancel</a>
    </form>
</div>
{% endblock %}
