<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank O Mida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ── Tokens ────────────────────────────────────────────── */
        :root {
            --color-bg:       #FAF7F2;
            --color-surface:  #FFFFFF;
            --color-primary:  #2C1810;
            --color-accent:   #C9935A;
            --color-muted:    #7A6A5A;
            --color-border:   #E8DDD0;
            --font-serif:     'Playfair Display', Georgia, serif;
            --font-sans:      'Inter', system-ui, sans-serif;
            --radius:         8px;
            --shadow:         0 2px 12px rgba(44, 24, 16, 0.08);
            --shadow-hover:   0 4px 20px rgba(44, 24, 16, 0.14);

            /* ── Podium colours ───────────────────────────────── */
            --color-gold-border:  #D4AF37;
            --color-gold-bg:      #FFFBEA;
            --color-gold-text:    #A07D00;

            --color-silver-border: #A8A9AD;
            --color-silver-bg:     #F5F5F7;
            --color-silver-text:   #6B6B78;

            --color-bronze-border: #CD7F32;
            --color-bronze-bg:     #FDF4EC;
            --color-bronze-text:   #8B4A0F;
        }

        /* ── Reset ─────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--color-bg);
            color: var(--color-primary);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--color-accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ── Layout ────────────────────────────────────────────── */
        .container {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ── Nav ───────────────────────────────────────────────── */
        header {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .nav-brand {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: 0.02em;
        }
        .nav-brand:hover { text-decoration: none; color: var(--color-accent); }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            list-style: none;
        }
        .nav-links a,
        .nav-action button {
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-muted);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: color 0.15s;
        }
        .nav-links a:hover,
        .nav-action button:hover {
            color: var(--color-accent);
            text-decoration: none;
        }
        .nav-user {
            font-size: 0.8rem;
            color: var(--color-muted);
            border-right: 1px solid var(--color-border);
            padding-right: 1.5rem;
        }

        /* ── Main ──────────────────────────────────────────────── */
        main {
            flex: 1;
            padding: 3rem 0 5rem;
        }

        /* ── Typography ────────────────────────────────────────── */
        h1 {
            font-family: var(--font-serif);
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }
        h2 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        /* ── Buttons ───────────────────────────────────────────── */
        .btn {
            display: inline-block;
            padding: 0.625rem 1.5rem;
            border-radius: var(--radius);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--color-accent);
            color: var(--color-surface);
            border-color: var(--color-accent);
        }
        .btn-primary:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--color-surface);
            text-decoration: none;
            box-shadow: var(--shadow-hover);
        }

        /* ── Forms ─────────────────────────────────────────────── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            margin-bottom: 1.25rem;
        }
        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-primary);
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--color-primary);
            background: var(--color-surface);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(201, 147, 90, 0.18);
        }
        .errorlist {
            list-style: none;
            color: #c0392b;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        /* ── Breadcrumb ────────────────────────────────────────── */
        .breadcrumb {
            margin-bottom: 1.25rem;
        }
        .breadcrumb a {
            font-size: 0.875rem;
            color: var(--color-muted);
        }
        .breadcrumb a:hover { color: var(--color-accent); }

        /* ── Cards ─────────────────────────────────────────────── */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .card h2 a { color: var(--color-primary); }
        .card h2 a:hover { color: var(--color-accent); text-decoration: none; }
        .card-meta {
            font-size: 0.85rem;
            color: var(--color-muted);
        }

        /* ── Detail card ───────────────────────────────────────── */
        .detail-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            max-width: 640px;
        }
        .detail-card h1 { margin-bottom: 1.25rem; }
        .meta-list {
            list-style: none;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .meta-list li {
            font-size: 0.9rem;
            color: var(--color-muted);
        }
        .meta-list strong { color: var(--color-primary); }
        .detail-description {
            margin-bottom: 1.75rem;
            line-height: 1.7;
        }

        /* ── Auth card ─────────────────────────────────────────── */
        .auth-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            max-width: 440px;
            margin: 0 auto;
        }
        .auth-card h1 {
            font-size: 1.75rem;
            margin-bottom: 1.75rem;
        }

        /* ── Form card ─────────────────────────────────────────── */
        .form-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            max-width: 560px;
        }
        .form-card h1 { margin-bottom: 0.375rem; }
        .form-card .dish-subtitle {
            color: var(--color-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        /* ── Leaderboard ───────────────────────────────────────── */
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1.5rem 0 2rem;
        }
        .tab-nav a {
            display: inline-block;
            padding: 0.375rem 1rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--color-border);
            color: var(--color-muted);
            background: var(--color-surface);
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .tab-nav a:hover { border-color: var(--color-accent); color: var(--color-accent); text-decoration: none; }
        .tab-nav a[aria-current="page"] {
            background: var(--color-accent);
            border-color: var(--color-accent);
            color: var(--color-surface);
        }
        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .rank-entry {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            box-shadow: var(--shadow);
        }
        .rank-number {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-accent);
            min-width: 2rem;
            text-align: center;
        }
        .rank-name {
            flex: 1;
        }
        .rank-name .dish-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--color-primary);
        }
        .rank-name .venue-name {
            font-size: 0.85rem;
            color: var(--color-muted);
        }
        .score-badge {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 0.25rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-primary);
            white-space: nowrap;
        }

        /* ── Podium entries ────────────────────────────────────── */
        .rank-entry--gold {
            border-color: var(--color-gold-border);
            background: var(--color-gold-bg);
        }
        .rank-entry--gold .rank-number {
            color: var(--color-gold-text);
        }
        .rank-entry--silver {
            border-color: var(--color-silver-border);
            background: var(--color-silver-bg);
        }
        .rank-entry--silver .rank-number {
            color: var(--color-silver-text);
        }
        .rank-entry--bronze {
            border-color: var(--color-bronze-border);
            background: var(--color-bronze-bg);
        }
        .rank-entry--bronze .rank-number {
            color: var(--color-bronze-text);
        }

        /* ── Photos ────────────────────────────────────────────── */
        .card-photo {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: block;
        }
        .detail-photo {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            display: block;
        }
        .photo-with-source {
            position: relative;
            display: block;
            overflow: hidden;
            border-radius: var(--radius);
        }
        .photo-with-source:has(.card-photo) {
            margin-bottom: 1rem;
        }
        .photo-with-source:has(.detail-photo) {
            margin-bottom: 1.5rem;
        }
        .photo-with-source .card-photo,
        .photo-with-source .detail-photo {
            margin-bottom: 0;
            border-radius: 0;
        }
        .photo-source-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0.6rem 0.75rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent 55%);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        .photo-with-source:hover .photo-source-overlay,
        .photo-with-source:focus-within .photo-source-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        .photo-source-overlay a,
        .photo-source-overlay span {
            color: #fff;
            font-size: 0.85rem;
            line-height: 1.3;
            text-align: center;
            text-decoration: none;
        }
        .photo-source-overlay a:hover {
            text-decoration: underline;
        }
        .venue-photo {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-top: 0.5rem;
            display: block;
        }
        .venue-coords {
            font-size: 0.8rem;
            color: var(--color-muted);
            display: block;
            margin-top: 0.25rem;
        }

        /* ── Footer ────────────────────────────────────────────── */
        .community-notes {
            margin-top: 2.5rem;
            max-width: 640px;
        }
        .community-notes h2 {
            margin-bottom: 1.25rem;
        }
        .community-comment {
            word-break: break-word;
        }
        .community-empty {
            color: var(--color-muted);
            font-size: 0.9rem;
        }
        .community-notes-sort {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }
        .community-notes-sort .btn-active {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }
        .community-pagination {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        .pagination-info {
            font-size: 0.875rem;
            color: var(--color-muted);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.8rem;
            color: var(--color-muted);
            border-top: 1px solid var(--color-border);
        }

        /* ── Star rating widget ────────────────────────────────── */
        /*
         * DOM order: input[5] label[5] input[4.5] label[4.5] ... input[1] label[1]
         * flex-direction: row-reverse renders them visually as: ★1 ★2 ★3 ★4 ★5
         * input:checked ~ label fills all subsequent siblings (= lower-value stars, visually left of checked)
         *
         * Each star position 2–5 is split into two half-width labels:
         *   .star-half  (left half, value N-0.5): direction:ltr  + overflow:hidden → shows left half of ★
         *   .star-full  (right half, value N):    direction:rtl  + overflow:hidden → shows right half of ★
         * Star 1 is a full-width standalone label (.star-first).
         */
        .star-widget {
            display: inline-flex;
            flex-direction: row-reverse;
            font-size: 1.75rem;
            line-height: 1;
            cursor: pointer;
            vertical-align: middle;
        }
        .star-widget input[type="radio"] {
            display: none;
        }
        /* Shared half-label base */
        .star-widget label {
            display: block;
            width: 0.5em;   /* half of 1 star width */
            overflow: hidden;
            color: var(--color-border);
            cursor: pointer;
            transition: color 0.1s;
            font-size: 1.75rem;
            line-height: 1;
        }
        .star-widget label::before {
            content: '★';
            display: block;
            font-size: inherit;
            line-height: inherit;
            white-space: nowrap;
        }
        /* Left half: ltr alignment clips off the right side */
        .star-widget label.star-half {
            direction: ltr;
            unicode-bidi: bidi-override;
        }
        /* Right half: rtl pushes the character right, overflow hides the left */
        .star-widget label.star-full {
            direction: rtl;
            unicode-bidi: bidi-override;
        }
        /* Star 1 standalone: full width */
        .star-widget label.star-first {
            width: 1em;
            direction: ltr;
            unicode-bidi: normal;
        }
        /* Filled state: checked radio fills its label and all subsequent sibling labels */
        .star-widget input[type="radio"]:checked ~ label {
            color: var(--color-accent);
        }
        /* Hover preview: reset all stars on widget hover, then fill up to hovered position */
        .star-widget:hover label {
            color: var(--color-border);
        }
        .star-widget label:hover,
        .star-widget label:hover ~ label {
            color: var(--color-accent);
        }

        /* Make star fields sit inline with their text label */
        .form-group:has(.star-widget) {
            flex-direction: row;
            align-items: center;
            gap: 0.75rem;
        }
        .form-group:has(.star-widget) > label {
            white-space: nowrap;
            min-width: 9rem;
        }
    </style>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <header>
        <nav class="container">
            <a href="{% url 'catalog:list' %}" class="nav-brand">Rank O Mida</a>
            <ul class="nav-links">
                <li><a href="{% url 'catalog:list' %}">Dishes</a></li>
                <li><a href="{% url 'catalog:venue_list' %}">Venues</a></li>
                <li><a href="{% url 'leaderboard:list' %}">Leaderboard</a></li>
                {% if user.is_authenticated %}
                    <li class="nav-user"><a href="{% url 'profile' user.username %}">{{ user.username }}</a></li>
                    <li class="nav-action">
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit">Logout</button>
                        </form>
                    </li>
                {% else %}
                    <li><a href="{% url 'login' %}">Login</a></li>
                    <li><a href="{% url 'register' %}">Register</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <div class="container">Rank O Mida</div>
    </footer>
</body>
</html>
